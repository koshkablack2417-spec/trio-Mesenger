name: Android APK

# Запуск вручную: вкладка Actions → Android APK → Run workflow.
# Готовый файл появится внизу страницы запуска в разделе Artifacts и в Releases.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://btohzbmjtfxxxwyajpar.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_nQ3pDKM8tzLFI0p7W1ZEIA_2zHBRW28
      EXPO_PUBLIC_REQUIRE_PHONE_FOR_EMAIL_USERS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx expo install --fix
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk trio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: trio-apk
          path: trio.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest trio.apk --title "Трио (Android APK)" --notes "Сборка из ветки main. Скачай trio.apk и установи на телефон."
